name: VS Code Build & Test

on:
  push:
    # The family's default branch is `master`; `main` is listed too because
    # the sibling repos ship workflows triggered on `main` while their real
    # default branch is `master`, so their badges have been green off a
    # 1.0-era commit ever since. Listing both means this badge reports the
    # branch the work is actually on, whichever name the remote settles on.
    branches: [ "master", "main" ]
    # A release is a tag. `branches` and `tags` are OR-ed by GitHub, so a
    # push of `v1.3.0` runs Build and Test exactly as a branch push does and
    # then — and only then — the publish job below. The two-part `v1.0` style
    # of the early tags is deliberately not matched: the Marketplace requires
    # a three-part version and a tag that cannot be one should not start a
    # release.
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-test:
    name: Build and Test
    # Unlike the Apple repos there is no SDK to pin a runner image to: the
    # extension is TypeScript bundled by esbuild, and the tests are vitest
    # over the parity core with no editor in the loop. Nothing here is
    # platform-specific, so the cheapest hosted runner is the honest one.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned to the major the extension host actually runs: VS Code
          # 1.95 — the oldest editor this extension declares support for —
          # runs extensions on Node 20, and esbuild targets node20 to match.
          # `latest` would let a newer major's API into the bundle and the
          # failure would surface in a user's editor rather than here.
          node-version: '20'

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Show toolchain
        # Deliberately AFTER `npm ci`, and via `npm exec --no`.
        #
        # `npx tsc --version` before the install does not print TypeScript's
        # version: with nothing installed, npx resolves `tsc` from the registry,
        # where it is an unrelated abandoned package that prints "This is not the
        # tsc command you are looking for" and exits 1. Under `bash -e` that
        # fails the whole job — which is exactly how this workflow first broke.
        # `--no` forbids the install-on-miss behaviour outright, so if a tool is
        # ever missing from devDependencies this step says so instead of
        # silently running a stranger's package off the network.
        run: |
          npm exec --no -- tsc --version
          npm exec --no -- vsce --version

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Compile
        run: npm run compile

      - name: Package
        # Not `vsce package` directly. The Marketplace details page is a
        # different document from this repository's README, and vsce has no
        # --readme-path: the details tab is always README.md at the root of
        # the .vsix. `scripts/package.mjs` therefore stands
        # marketplace/extension-README.md in at that filename for the length
        # of the vsce run and puts the real one back afterwards — from a
        # finally block, from SIGINT/SIGTERM and from uncaughtException, with
        # a hash check that the restored file is byte-identical. Calling vsce
        # straight from here would silently publish the wrong document.
        #
        # `--list` is the old `vsce ls` line, moved inside that script so it
        # runs against the same tree vsce packages. It prints the exact file
        # manifest the .vsix will carry, so a mistake in .vscodeignore — the
        # whole of `media/rich/` dropped, or `node_modules` swept in — shows
        # up in the log as a list rather than as an extension that installs
        # and cannot find its engines.
        #
        # The script shells out through `npm exec --no`, for the same reason
        # as the toolchain step above: it refuses to reach the registry, so a
        # tool missing from devDependencies fails loudly here instead of
        # running whatever happens to own that name on npm.
        #
        # `npm run package` is deliberately NOT what runs here: it re-runs the
        # type-check, the tests and the compile, which are the three steps
        # immediately above.
        run: node scripts/package.mjs --list

      - name: Upload the packaged extension
        # The siblings upload artifacts only `if: failure()`, because there
        # the artifact is a diagnostic. Here it is the build product, and
        # the thing a human wants from a green run is the installable file.
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 7

  # --------------------------------------------------------------------------
  # Publish — inert until nettrash adds the two secrets.
  # --------------------------------------------------------------------------
  #
  # WHY THIS JOB DOES NOTHING TODAY, ON PURPOSE
  # -------------------------------------------
  # There is no Marketplace PAT and no Open VSX token in this repository, and
  # no Eclipse account behind the second one yet (marketplace/README.md lists
  # the five one-time steps). A publish job that failed loudly for want of a
  # secret would turn every tag red; one that publishes only when both tokens
  # exist is simply not there until the day they do. So the secrets are read
  # into a step's own environment, that step writes a flag, and every step
  # after it is guarded by the flag.
  #
  # The secrets have to be read that way round because `secrets` is not one of
  # the contexts GitHub makes available to a job-level `if:` — only `github`,
  # `needs`, `vars` and `inputs` are. A job-level `if: secrets.VSCE_PAT != ''`
  # looks right, evaluates to nothing, and runs the job unconditionally.
  #
  # And the gates run first: `needs: build-test` means a tag whose type-check,
  # tests, compile or packaging fails publishes nothing at all.
  #
  publish:
    name: Publish
    needs: build-test
    # A tag, and nothing else. `github.ref` for a tag push is
    # `refs/tags/v1.3.0`; for a branch push it is `refs/heads/master`.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The same major as the job above. `ovsx` is pinned to the 0.10 line
          # for this reason: its 1.x releases require Node 22 or newer, and
          # the runtime here follows the extension host rather than the tool.
          node-version: '20'

      - name: Do we have the tokens?
        id: tokens
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ] && [ -n "$OVSX_PAT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing published::VSCE_PAT and OVSX_PAT are not both set, so this tag was not published to either registry. See marketplace/README.md."
          fi

      - name: Does the tag match package.json?
        if: steps.tokens.outputs.ready == 'true'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION. Nothing published."
            exit 1
          fi
          echo "Publishing version $VERSION."

      - name: Install
        if: steps.tokens.outputs.ready == 'true'
        run: npm ci

      - name: Gates
        if: steps.tokens.outputs.ready == 'true'
        # Repeated here rather than trusted to the job above, because this job
        # checks the tree out again and publishes what IT built: the artefact
        # that goes to two registries must be the one these three gates passed.
        run: |
          npm run typecheck
          npm run test
          npm run compile

      - name: Package
        if: steps.tokens.outputs.ready == 'true'
        # Through the script, never `vsce package`: the Marketplace details
        # page is the packaged README.md, and this is what stands
        # marketplace/extension-README.md in at that filename. Open VSX reads
        # the same file out of the same .vsix.
        run: node scripts/package.mjs --list

      - name: Publish to the Marketplace and to Open VSX
        if: steps.tokens.outputs.ready == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        # One script for both, so the two registries cannot come to hold two
        # different builds of one version. It publishes the .vsix by path and
        # never lets either tool package anything itself.
        run: npm run publish:vsix

      - name: Upload the published extension
        if: steps.tokens.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vsix-release
          path: '*.vsix'
          # Longer than the branch build's seven days: this is the artefact
          # that was actually published, and the first question after a bad
          # release is "what exactly went out?".
          retention-days: 90
