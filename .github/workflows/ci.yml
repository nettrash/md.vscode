name: VS Code Build & Test

on:
  push:
    # The family's default branch is `master`; `main` is listed too because
    # the sibling repos ship workflows triggered on `main` while their real
    # default branch is `master`, so their badges have been green off a
    # 1.0-era commit ever since. Listing both means this badge reports the
    # branch the work is actually on, whichever name the remote settles on.
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-test:
    name: Build and Test
    # Unlike the Apple repos there is no SDK to pin a runner image to: the
    # extension is TypeScript bundled by esbuild, and the tests are vitest
    # over the parity core with no editor in the loop. Nothing here is
    # platform-specific, so the cheapest hosted runner is the honest one.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned to the major the extension host actually runs: VS Code
          # 1.95 — the oldest editor this extension declares support for —
          # runs extensions on Node 20, and esbuild targets node20 to match.
          # `latest` would let a newer major's API into the bundle and the
          # failure would surface in a user's editor rather than here.
          node-version: '20'

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Show toolchain
        # Deliberately AFTER `npm ci`, and via `npm exec --no`.
        #
        # `npx tsc --version` before the install does not print TypeScript's
        # version: with nothing installed, npx resolves `tsc` from the registry,
        # where it is an unrelated abandoned package that prints "This is not the
        # tsc command you are looking for" and exits 1. Under `bash -e` that
        # fails the whole job — which is exactly how this workflow first broke.
        # `--no` forbids the install-on-miss behaviour outright, so if a tool is
        # ever missing from devDependencies this step says so instead of
        # silently running a stranger's package off the network.
        run: |
          npm exec --no -- tsc --version
          npm exec --no -- vsce --version

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Compile
        run: npm run compile

      - name: Package
        # Not `vsce package` directly. The Marketplace details page is a
        # different document from this repository's README, and vsce has no
        # --readme-path: the details tab is always README.md at the root of
        # the .vsix. `scripts/package.mjs` therefore stands
        # marketplace/extension-README.md in at that filename for the length
        # of the vsce run and puts the real one back afterwards — from a
        # finally block, from SIGINT/SIGTERM and from uncaughtException, with
        # a hash check that the restored file is byte-identical. Calling vsce
        # straight from here would silently publish the wrong document.
        #
        # `--list` is the old `vsce ls` line, moved inside that script so it
        # runs against the same tree vsce packages. It prints the exact file
        # manifest the .vsix will carry, so a mistake in .vscodeignore — the
        # whole of `media/rich/` dropped, or `node_modules` swept in — shows
        # up in the log as a list rather than as an extension that installs
        # and cannot find its engines.
        #
        # The script shells out through `npm exec --no`, for the same reason
        # as the toolchain step above: it refuses to reach the registry, so a
        # tool missing from devDependencies fails loudly here instead of
        # running whatever happens to own that name on npm.
        #
        # `npm run package` is deliberately NOT what runs here: it re-runs the
        # type-check, the tests and the compile, which are the three steps
        # immediately above.
        run: node scripts/package.mjs --list

      - name: Upload the packaged extension
        # The siblings upload artifacts only `if: failure()`, because there
        # the artifact is a diagnostic. Here it is the build product, and
        # the thing a human wants from a green run is the installable file.
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 7
